name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
  release:
    needs: acceptance
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Require a tagged commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Import release signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Verify release signing identity
        env:
          ACTUAL: ${{ steps.gpg.outputs.fingerprint }}
          EXPECTED: ${{ vars.RELEASE_SIGNING_KEY_FINGERPRINT }}
        run: |
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::Configure the matching verified release signing fingerprint.'
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
